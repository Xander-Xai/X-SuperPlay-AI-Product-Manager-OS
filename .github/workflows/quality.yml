name: curriculum-quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/validate_repo.py
      - run: python tools/learning_router.py validate
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python -m unittest discover -s labs -p 'test_*.py' -v
